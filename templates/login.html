{% extends "base.html" %}
{% block titulo %}Entrar - Simulador{% endblock %}
{% block conteudo %}
<section class="cartao cartao-auth">
    <h1>Entrar</h1>
    {% if erro %}<p class="alerta-erro" role="alert">{{ erro }}</p>{% endif %}
    <form method="post" class="form-auth" autocomplete="on">
        <label>Usuário
            <input type="text" name="usuario" value="{{ usuario }}" autocomplete="username" required autofocus>
        </label>
        <label>Senha
            <input type="password" name="senha" autocomplete="current-password" required>
        </label>
        <button type="submit" class="botao-primario">Entrar</button>
    </form>
    <p class="texto-auxiliar"><a href="{{ url_for('auth.recuperar') }}">Esqueci minha senha</a></p>
    <p class="texto-auxiliar">Ainda não tem conta? <a href="{{ url_for('auth.registro') }}">Cadastre-se</a></p>
</section>
{% endblock %}
