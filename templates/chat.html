<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <div class="sidebar-usuario">
            <span>{{ operador_nome }} <span class="etiqueta-modo etiqueta-{{ modo }}">{{ 'Treino' if modo == 'treino' else 'Avaliação' }}</span></span>
            <div class="sidebar-links">
                <a href="{{ url_for('painel.historico') }}" target="_blank" rel="noopener">Histórico</a>
                <a href="{{ url_for('painel.ranking_view') }}" target="_blank" rel="noopener">Ranking</a>
                <form method="post" action="{{ url_for('auth.sair') }}" class="form-inline">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="link-botao">Sair</button>
                </form>
            </div>
        </div>
        <h3>Atendimentos</h3>

        {% for at in atendimentos %}
        <div class="chat-item" id="chat-item-{{ at.id }}" onclick="selecionar({{ at.id }})">
            <span class="chat-label">Cliente {{ at.id + 1 }} - {{ at.titulo }}</span>
            <span id="timer-{{ at.id }}" class="timer">Aguardando</span>
        </div>
        {% endfor %}
    </aside>

    <main class="chat-area">
        <div class="messages" id="messages"></div>

        <div class="painel-metricas" id="painel-metricas">
            <span>Cliente: <b id="m-humor" class="humor-pill humor-calmo">Calmo</b></span>
            <span>Coerência: <b id="m-coerencia">0</b></span>
            <span>Empatia: <b id="m-empatia">0</b></span>
            <span>Tempo: <b id="m-tempo">0</b></span>
            <span>Nota: <b id="m-nota">0</b></span>
            <span>Nível: <b id="m-nivel">-</b></span>
        </div>

        <div class="feedback-area" id="feedback-area" style="display:none">
            <button type="button" id="btn-feedback" class="botao-dica" onclick="pedirFeedback()">💬 Feedback sobre minha resposta</button>
            <div class="feedback-box" id="feedback-box" style="display:none"></div>
        </div>

        <div class="dica-area" id="dica-area" style="display:none">
            <button type="button" id="btn-dica" class="botao-dica" onclick="pedirDica()">💡 Pedir dica</button>
        </div>

        <div
            class="sugestao-box"
            id="sugestao"
            style="display:none"
            oncopy="return false"
            oncut="return false"
            onpaste="return false">
        </div>

        <div class="input-area">
            <textarea id="resposta" placeholder="Digite sua resposta..."></textarea>
            <button type="button" onclick="enviar()">Enviar</button>
        </div>
    </main>

</div>

<script>
let dados = {{ atendimentos | tojson }};
let atual = dados.length > 0 ? dados[0].id : 0;

const MODO = {{ modo | tojson }};
const TEMPO_LIMITE = {{ tempo_limite_chat | tojson }};
const INTERVALO_ENTRE_CHATS = {{ intervalo_entre_chats | tojson }};
let simulacaoIniciadaEm = {{ simulacao_iniciada_em | tojson }};
let telaFinalMostrada = false;

// Os prazos são calculados no servidor; usamos o relógio dele para não depender da hora do navegador.
let offsetRelogio = {{ servidor_agora | tojson }} - Date.now() / 1000;

function agoraServidor() {
    return Date.now() / 1000 + offsetRelogio;
}

function prepararDadosIniciais() {
    dados = dados.sort((a, b) => a.id - b.id);

    dados.forEach((at, index) => {
        at.finalizado = Boolean(at.finalizado);
        at.bloqueado_tempo = Boolean(at.bloqueado_tempo);
        at.encerrado_por_cliente = Boolean(at.encerrado_por_cliente);
        at.irritacao = Number(at.irritacao || 0);
        at.humor = at.humor || "calmo";
        at.total_erros = Number(at.total_erros || 0);
        at.media_coerencia = Number(at.media_coerencia || 0);
        at.media_empatia = Number(at.media_empatia || 0);
        at.media_tempo = Number(at.media_tempo || 0);
        at.nota = Number(at.nota || calcularNotaLocal(at));
        at.nivel = at.nivel || classificarGeral(at.nota);
        at.mensagens = at.mensagens || [];
        at.dicaTexto = "";
        at.feedbackTexto = "";

        at.liberadoEm = Number(
            at.liberado_em !== undefined && at.liberado_em !== null
                ? at.liberado_em
                : simulacaoIniciadaEm + (index * INTERVALO_ENTRE_CHATS)
        );

        at.iniciado = agoraServidor() >= at.liberadoEm;

        if (at.ultimo_tempo_backend !== undefined && at.ultimo_tempo_backend !== null) {
            at.ultimoTempo = Number(at.ultimo_tempo_backend);
        } else {
            at.ultimoTempo = at.liberadoEm;
        }
    });
}

function calcularNotaLocal(at) {
    const base = Number(at.media_coerencia || 0);
    const bonusEmpatia = Number(at.media_empatia || 0);
    const bonusTempo = Number(at.media_tempo || 0);
    const penalidadeErros = Number(at.total_erros || 0) * 5;

    const nota = base + bonusEmpatia + bonusTempo - penalidadeErros;
    return Math.max(0, Math.min(100, Number(nota.toFixed(1))));
}

function escaparHtml(texto) {
    const div = document.createElement("div");
    div.innerText = texto;
    return div.innerHTML;
}

function destacarErros(texto, erros) {
    if (!erros || erros.length === 0) return escaparHtml(texto);

    const errosOrdenados = [...erros].sort((a, b) => a.offset - b.offset);

    let resultado = "";
    let cursor = 0;

    errosOrdenados.forEach(e => {
        if (e.offset < cursor) return;

        resultado += escaparHtml(texto.substring(cursor, e.offset));
        const trecho = texto.substring(e.offset, e.offset + e.length);
        resultado += `<span class="erro">${escaparHtml(trecho)}</span>`;
        cursor = e.offset + e.length;
    });

    resultado += escaparHtml(texto.substring(cursor));
    return resultado;
}

function buscarAtendimentoPorId(id) {
    return dados.find(item => item.id === id);
}

const ROTULO_HUMOR = {
    calmo: "Calmo",
    impaciente: "Impaciente",
    atritado: "Atritado",
    encerrado: "Desistiu"
};

function textoFinalizado(at) {
    return at.encerrado_por_cliente ? "Cliente encerrou" : "Finalizado";
}

function classeFinalizado(at) {
    return at.encerrado_por_cliente ? "timer vermelho" : "timer verde";
}

function atualizarPainel() {
    const at = buscarAtendimentoPorId(atual);
    if (!at) return;

    const humor = at.humor || "calmo";
    const pill = document.getElementById("m-humor");
    pill.innerText = ROTULO_HUMOR[humor] || "Calmo";
    pill.className = "humor-pill humor-" + humor;

    document.getElementById("m-coerencia").innerText = Number(at.media_coerencia || 0).toFixed(1);
    document.getElementById("m-empatia").innerText = Number(at.media_empatia || 0).toFixed(1);
    document.getElementById("m-tempo").innerText = Number(at.media_tempo || 0).toFixed(1);
    document.getElementById("m-nota").innerText = Number(at.nota || 0).toFixed(1);
    document.getElementById("m-nivel").innerText = at.nivel || "-";
}

function renderMensagens() {
    const at = buscarAtendimentoPorId(atual);
    if (!at) return;

    const box = document.getElementById("messages");
    box.innerHTML = "";

    at.mensagens.forEach(msg => {
        const div = document.createElement("div");
        div.className = msg.tipo === "cliente" ? "msg-cliente" : "msg-operador";
        if (msg.tipo === "cliente" && msg.humor) {
            div.className += " humor-" + msg.humor;
        }

        if (msg.tipo === "operador") {
            let conteudo = msg.texto;

            if (msg.erros && msg.erros.length > 0) {
                conteudo = destacarErros(msg.texto, msg.erros);
            } else {
                conteudo = escaparHtml(msg.texto);
            }

            let avisosHtml = "";
            if (msg.avisos && msg.avisos.length > 0) {
                avisosHtml = `<div class="mensagem-erro-info">${msg.avisos.map(escaparHtml).join(" ")}</div>`;
            }

            div.innerHTML = conteudo + avisosHtml;
        } else {
            div.innerText = msg.texto;
        }

        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
    atualizarPainel();
    atualizarEstadoCampo();
}

function chatJaFoiLiberado(at) {
    const agora = agoraServidor();
    return agora >= at.liberadoEm;
}

function tempoDecorridoNoTurno(at) {
    const agora = agoraServidor();
    return Math.max(0, Math.floor(agora - at.ultimoTempo));
}

function turnoExpirado(at) {
    if (MODO === "treino") return false;
    if (at.finalizado) return false;
    if (!chatJaFoiLiberado(at)) return false;
    return tempoDecorridoNoTurno(at) >= TEMPO_LIMITE;
}

function atendimentoEncerrado(at) {
    return at.finalizado || at.bloqueado_tempo || turnoExpirado(at);
}

function verificarFinalizacaoGeral() {
    const algumChatLiberado = dados.some(at => chatJaFoiLiberado(at));
    if (!algumChatLiberado) return false;

    return dados.every(at => atendimentoEncerrado(at));
}

function atualizarEstadoCampo() {
    const at = buscarAtendimentoPorId(atual);
    const campo = document.getElementById("resposta");
    const botao = document.querySelector(".input-area button");

    if (!at) return;

    if (at.finalizado) {
        campo.disabled = true;
        botao.disabled = true;
        campo.placeholder = at.encerrado_por_cliente
            ? "O cliente encerrou o atendimento."
            : "Este atendimento foi finalizado.";
        return;
    }

    if (!chatJaFoiLiberado(at)) {
        campo.disabled = true;
        botao.disabled = true;
        campo.placeholder = "Este atendimento ainda não iniciou.";
        return;
    }

    if (turnoExpirado(at)) {
        at.bloqueado_tempo = true;
    }

    if (at.bloqueado_tempo) {
        campo.disabled = true;
        botao.disabled = true;
        campo.placeholder = "Tempo esgotado para este atendimento.";
        return;
    }

    campo.disabled = false;
    botao.disabled = false;
    campo.placeholder = "Digite sua resposta...";
}

function selecionar(id) {
    atual = id;
    const at = buscarAtendimentoPorId(id);
    if (!at) return;

    document.querySelectorAll(".chat-item").forEach(item => {
        item.classList.remove("ativo");
    });

    const itemAtual = document.getElementById("chat-item-" + id);
    if (itemAtual) {
        itemAtual.classList.add("ativo");
    }

    renderMensagens();
    atualizarDica(at);
    atualizarFeedback(at);

    if (MODO === "treino" && at.dica_nivel > 0 && !at.dicaTexto && !at.finalizado) {
        pedirDica(true);
    }
}

const ROTULO_ORIGEM = {};  // todo feedback é gerado localmente pelo sistema
function rotuloOrigem() { return "Análise automática"; }

function atualizarFeedback(at) {
    const area = document.getElementById("feedback-area");
    const box = document.getElementById("feedback-box");
    const botao = document.getElementById("btn-feedback");

    if (MODO !== "treino") {
        area.style.display = "none";
        return;
    }

    const temResposta = (at.mensagens || []).some(m => m.tipo === "operador");
    area.style.display = temResposta ? "" : "none";
    botao.disabled = false;
    botao.innerText = "💬 Feedback sobre minha resposta";

    box.style.display = at.feedbackTexto ? "" : "none";
    box.innerText = at.feedbackTexto || "";
}

function pedirFeedback() {
    const at = buscarAtendimentoPorId(atual);
    if (!at) return;

    const botao = document.getElementById("btn-feedback");
    botao.disabled = true;
    botao.innerText = "Gerando feedback...";

    fetch("/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: at.id })
    })
        .then(r => r.json().catch(() => ({})).then(d => ({ ok: r.ok, status: r.status, d })))
        .then(({ ok, status, d }) => {
            if (status === 401) { window.location.href = "/login"; return; }
            if (!ok) {
                alert(d.erro || "Não foi possível gerar o feedback.");
                return;
            }
            at.feedbackTexto = rotuloOrigem() + ": " + d.texto;
        })
        .catch(() => alert("Não foi possível gerar o feedback."))
        .finally(() => {
            if (buscarAtendimentoPorId(atual) === at) atualizarFeedback(at);
        });
}

function atualizarDica(at) {
    const area = document.getElementById("dica-area");
    const box = document.getElementById("sugestao");
    const botao = document.getElementById("btn-dica");

    if (MODO !== "treino") {
        area.style.display = "none";
        box.style.display = "none";
        return;
    }

    area.style.display = "";
    box.style.display = at.dicaTexto ? "" : "none";
    box.innerText = at.dicaTexto || "";

    const nivel = Number(at.dica_nivel || 0);
    botao.disabled = Boolean(at.finalizado) || nivel >= 2;
    botao.innerText = nivel === 0 ? "💡 Pedir dica"
        : (nivel === 1 ? "💡 Mostrar resposta sugerida" : "Dicas esgotadas");
}

function pedirDica(apenasAtual) {
    const at = buscarAtendimentoPorId(atual);
    if (!at || at.finalizado) return;

    fetch("/dica", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: at.id, atual: Boolean(apenasAtual) })
    })
        .then(r => r.json().catch(() => ({})).then(d => ({ ok: r.ok, status: r.status, d })))
        .then(({ ok, status, d }) => {
            if (status === 401) { window.location.href = "/login"; return; }
            if (!ok) {
                if (!apenasAtual) alert(d.erro || "Não foi possível obter a dica.");
                return;
            }
            at.dica_nivel = Number(d.nivel || 0);
            at.dicaTexto = d.texto || "";
            if (buscarAtendimentoPorId(atual) === at) atualizarDica(at);
        })
        .catch(() => { if (!apenasAtual) alert("Não foi possível obter a dica."); });
}

function encontrarUltimaMensagemOperador(mensagens) {
    for (let i = mensagens.length - 1; i >= 0; i--) {
        if (mensagens[i].tipo === "operador") {
            return i;
        }
    }
    return -1;
}

function enviar() {
    const at = buscarAtendimentoPorId(atual);

    if (!at || at.finalizado) return;
    if (!chatJaFoiLiberado(at)) return;
    if (at.bloqueado_tempo || turnoExpirado(at)) return;

    const campo = document.getElementById("resposta");
    const texto = campo.value.trim();

    if (!texto) return;

    fetch("/responder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: at.id, resposta: texto })
    })
    .then(async r => {
        if (!r.ok) {
            let mensagem = "Erro ao responder atendimento.";
            try {
                const erroJson = await r.json();
                if (erroJson && erroJson.erro) {
                    mensagem = erroJson.erro;
                }
            } catch (e) {
                // resposta sem JSON (ex.: erro 500): mantém a mensagem padrão
            }
            const erro = new Error(mensagem);
            erro.status = r.status;
            throw erro;
        }
        return r.json();
    })
    .then(data => {
        if (data.servidor_agora !== undefined && data.servidor_agora !== null) {
            offsetRelogio = Number(data.servidor_agora) - Date.now() / 1000;
        }

        // O servidor só devolve o texto; guardamos o realce de erros das respostas anteriores.
        const anotacoesAnteriores = at.mensagens
            .filter(m => m.tipo === "operador")
            .map(m => ({ erros: m.erros, avisos: m.avisos }));

        at.mensagens = data.mensagens || [];

        let posOperador = 0;
        at.mensagens.forEach(m => {
            if (m.tipo !== "operador") return;
            const anterior = anotacoesAnteriores[posOperador++];
            if (anterior) {
                m.erros = anterior.erros;
                m.avisos = anterior.avisos;
            }
        });

        const idxOperador = encontrarUltimaMensagemOperador(at.mensagens);
        if (idxOperador !== -1) {
            at.mensagens[idxOperador].erros = data.erros_detalhados || [];
            at.mensagens[idxOperador].avisos = data.avisos || [];
        }

        at.total_erros = Number(data.total_erros || 0);
        at.media_coerencia = Number(data.media_coerencia || 0);
        at.media_empatia = Number(data.media_empatia || 0);
        at.media_tempo = Number(data.media_tempo || 0);
        at.nota = Number(data.nota || 0);
        at.nivel = data.nivel || "-";
        at.finalizado = Boolean(data.finalizado);
        at.bloqueado_tempo = Boolean(data.bloqueado_tempo);
        at.encerrado_por_cliente = Boolean(data.encerrado_por_cliente);
        at.irritacao = Number(data.irritacao || 0);
        at.humor = data.humor || "calmo";

        if (data.liberado_em !== undefined && data.liberado_em !== null) {
            at.liberadoEm = Number(data.liberado_em);
        }

        at.etapa_atual = Number(data.etapa_atual || 0);
        at.total_passos = Number(data.total_passos || at.total_passos || 0);
        at.dica_nivel = Number(data.dica_nivel || 0);
        if (!at.dica_nivel) {
            at.dicaTexto = "";
        }

        if (!at.finalizado) {
            at.ultimoTempo = (data.ultimo_tempo_backend !== undefined && data.ultimo_tempo_backend !== null)
                ? Number(data.ultimo_tempo_backend)
                : agoraServidor();
        }

        renderMensagens();
        campo.value = "";
        campo.focus();

        atualizarDica(at);
        at.feedbackTexto = "";
        atualizarFeedback(at);

        atualizarBadgeAtendimento(at);

        if (verificarFinalizacaoGeral()) {
            mostrarTelaFinal();
        }
    })
    .catch(error => {
        console.error("Erro no envio:", error);
        alert(error.message || "O atendimento não respondeu. Verifique o app.py ou o terminal do Flask.");

        if (error.status === 401) {
            window.location.href = "/login";
            return;
        }

        if (error.status === 409) {
            window.location.href = "/";
            return;
        }

        if (error.status === 403 && /expirou/i.test(error.message || "")) {
            at.bloqueado_tempo = true;
            atualizarBadgeAtendimento(at);
        }

        atualizarEstadoCampo();
    });
}

function atualizarBadgeAtendimento(at) {
    const el = document.getElementById("timer-" + at.id);
    if (!el) return;

    if (at.finalizado) {
        el.innerText = textoFinalizado(at);
        el.className = classeFinalizado(at);
        return;
    }

    if (at.bloqueado_tempo) {
        el.innerText = "Tempo esgotado";
        el.className = "timer vermelho";
    }
}

function iniciarNovaSimulacao() {
    window.location.href = "/";
}

function mostrarTelaFinal() {
    if (telaFinalMostrada) return;
    if (!verificarFinalizacaoGeral()) return;

    telaFinalMostrada = true;

    const total = dados.length;
    const somaNotas = dados.reduce((s, at) => s + Number(at.nota || 0), 0);
    const totalErros = dados.reduce((s, at) => s + Number(at.total_erros || 0), 0);

    const mediaGeral = total > 0 ? (somaNotas / total).toFixed(1) : "0.0";

    const mediaCoerencia = total > 0
        ? (dados.reduce((s, at) => s + Number(at.media_coerencia || 0), 0) / total).toFixed(1)
        : "0.0";

    const mediaEmpatia = total > 0
        ? (dados.reduce((s, at) => s + Number(at.media_empatia || 0), 0) / total).toFixed(1)
        : "0.0";

    const mediaTempo = total > 0
        ? (dados.reduce((s, at) => s + Number(at.media_tempo || 0), 0) / total).toFixed(1)
        : "0.0";

    const classificacao = classificarGeral(mediaGeral);

    const cardsAtendimentos = dados.map(at => {
        let status = "Finalizado";
        if (at.encerrado_por_cliente) {
            status = "Encerrado pelo cliente (insatisfeito)";
        } else if (at.bloqueado_tempo && !at.finalizado) {
            status = "Encerrado por tempo";
        }

        return `
            <div class="resultado-card">
                <h3>Cliente ${at.id + 1} - ${escaparHtml(at.titulo)}</h3>
                <p><b>Status:</b> ${escaparHtml(status)}</p>
                <p><b>Humor final do cliente:</b> ${escaparHtml(ROTULO_HUMOR[at.humor] || "Calmo")}</p>
                <p><b>Nota:</b> ${Number(at.nota || 0).toFixed(1)}</p>
                <p><b>Coerência:</b> ${Number(at.media_coerencia || 0).toFixed(1)}</p>
                <p><b>Empatia:</b> ${Number(at.media_empatia || 0).toFixed(1)}</p>
                <p><b>Tempo:</b> ${Number(at.media_tempo || 0).toFixed(1)}</p>
                <p><b>Erros:</b> ${Number(at.total_erros || 0)}</p>
                <p><b>Nível:</b> ${escaparHtml(at.nivel || "-")}</p>
            </div>
        `;
    }).join("");

    document.querySelector(".container").innerHTML = `
        <div class="resultado-final">
            <div class="resultado-final-box">
                <h1>Resultado Final</h1>

                <div class="resultado-resumo">
                    <div class="resultado-destaque">
                        <span class="resultado-titulo">Média Geral</span>
                        <span class="resultado-valor">${mediaGeral}</span>
                    </div>

                    <div class="resultado-badges">
                        <span class="badge-resultado">Coerência: ${mediaCoerencia}</span>
                        <span class="badge-resultado">Empatia: ${mediaEmpatia}</span>
                        <span class="badge-resultado">Tempo: ${mediaTempo}</span>
                        <span class="badge-resultado">Erros: ${totalErros}</span>
                        <span class="badge-resultado destaque-nivel">Classificação: ${classificacao}</span>
                    </div>
                </div>

                <div class="resultado-grid">
                    ${cardsAtendimentos}
                </div>

                <p class="resultado-salvo" id="resultado-salvo">Salvando resultado no histórico...</p>
                <div class="feedback-final" id="feedback-final" style="display:none"></div>

                <div class="resultado-acoes">
                    <button type="button" class="botao-nova-simulacao" onclick="iniciarNovaSimulacao()">
                        Nova simulação
                    </button>
                    <button type="button" class="botao-nova-simulacao" onclick="window.location.href='/historico'">
                        Meu histórico
                    </button>
                    <button type="button" class="botao-nova-simulacao" onclick="window.location.href='/ranking'">
                        Ranking
                    </button>
                </div>
            </div>
        </div>
    `;

    salvarResultadoFinal();
}

function salvarResultadoFinal() {
    const el = document.getElementById("resultado-salvo");

    fetch("/finalizar", { method: "POST" })
        .then(r => r.json().catch(() => ({})).then(d => ({ ok: r.ok, status: r.status, d })))
        .then(({ ok, status, d }) => {
            if (!el) return;
            if (status === 401) {
                window.location.href = "/login";
                return;
            }
            if (!ok) {
                el.textContent = d.erro || "Não foi possível salvar o resultado no histórico.";
                return;
            }
            let texto = MODO === "treino"
                ? "Treino salvo no seu histórico (não conta para o ranking)."
                : "Resultado salvo no seu histórico.";
            if (d.posicao) {
                texto += " Sua posição no ranking: " + d.posicao + "º de " + d.total_operadores + ".";
            }
            el.textContent = texto;
            buscarFeedbackFinal(d.id);
        })
        .catch(() => {
            if (el) el.textContent = "Não foi possível salvar o resultado no histórico (sem conexão).";
        });
}

function buscarFeedbackFinal(simulacaoId) {
    const el = document.getElementById("feedback-final");
    if (!el) return;
    el.style.display = "";
    el.textContent = "Gerando análise do seu desempenho...";

    fetch("/feedback-final", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: simulacaoId })
    })
        .then(r => r.json().catch(() => ({})).then(d => ({ ok: r.ok, d })))
        .then(({ ok, d }) => {
            if (!ok) { el.style.display = "none"; return; }
            el.textContent = rotuloOrigem() + ": " + d.texto;
        })
        .catch(() => { el.style.display = "none"; });
}

function classificarGeral(media) {
    const nota = Number(media);
    if (nota >= 90) return "Especialista";
    if (nota >= 75) return "Bom";
    if (nota >= 60) return "Intermediário";
    return "Iniciante";
}

function atualizarTimers() {
    const agora = agoraServidor();

    dados.forEach(at => {
        const el = document.getElementById("timer-" + at.id);
        if (!el) return;

        if (at.finalizado) {
            el.innerText = textoFinalizado(at);
            el.className = classeFinalizado(at);
            return;
        }

        if (agora < at.liberadoEm) {
            const restante = Math.ceil(at.liberadoEm - agora);
            el.innerText = "Inicia em " + restante + "s";
            el.className = "timer";
            return;
        }

        at.iniciado = true;

        if (MODO === "treino") {
            el.innerText = "Passo " + Math.min(at.etapa_atual + 1, at.total_passos) + "/" + at.total_passos;
            el.className = "timer verde";
            return;
        }

        const tempo = Math.floor(agora - at.ultimoTempo);
        const p = tempo / TEMPO_LIMITE;

        el.className = "timer";

        if (p >= 1) {
            el.innerText = "Tempo esgotado";
            el.classList.add("vermelho");
            at.bloqueado_tempo = true;
        } else if (p >= 0.75) {
            el.innerText = tempo + "s";
            el.classList.add("vermelho");
        } else if (p >= 0.5) {
            el.innerText = tempo + "s";
            el.classList.add("amarelo");
        } else {
            el.innerText = tempo + "s";
            el.classList.add("verde");
        }
    });

    atualizarEstadoCampo();

    if (verificarFinalizacaoGeral()) {
        mostrarTelaFinal();
    }
}

document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("resposta");

    if (!input) return;

    input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            enviar();
        }
    });
});

prepararDadosIniciais();
setInterval(atualizarTimers, 1000);

window.onload = () => {
    if (dados.length > 0) {
        selecionar(dados[0].id);
        atualizarTimers();
    }
};
