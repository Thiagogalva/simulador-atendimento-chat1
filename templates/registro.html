{% extends "base.html" %}
{% block titulo %}Cadastro - Simulador{% endblock %}
{% block conteudo %}
<section class="cartao cartao-auth">
    <h1>Criar conta</h1>
    {% if erros %}
    <ul class="alerta-erro" role="alert">
        {% for e in erros %}<li>{{ e }}</li>{% endfor %}
    </ul>
    {% endif %}
    <form method="post" class="form-auth" autocomplete="on">
        <label>Usuário (para entrar)
            <input type="text" name="usuario" value="{{ valores.usuario }}" autocomplete="username"
                   pattern="[a-z0-9._-]{3,30}" required autofocus>
        </label>
        <label>Nome de exibição (aparece no ranking)
            <input type="text" name="nome" value="{{ valores.nome }}" maxlength="40" autocomplete="nickname" required>
        </label>
        <label>Senha (mínimo 8 caracteres)
            <input type="password" name="senha" autocomplete="new-password" minlength="8" required>
        </label>
        <label>Confirmar senha
            <input type="password" name="confirmacao" autocomplete="new-password" minlength="8" required>
        </label>
        {% if exige_convite %}
        <label>Código de convite
            <input type="text" name="convite" autocomplete="off" required>
        </label>
        {% endif %}
        <button type="submit" class="botao-primario">Cadastrar</button>
    </form>
    <p class="texto-auxiliar">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</section>
{% endblock %}
